name: Test and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y lua5.2
      - run: lua5.2 tests/run.lua
      - run: python3 -m unittest discover -s tests -p 'test_release.py'
      - run: python3 tools/release.py

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mod-portal-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Package and publish
        run: python3 tools/release.py --publish
        env:
          GH_TOKEN: ${{ github.token }}
          FACTORIO_API_KEY: ${{ secrets.FACTORIO_API_KEY }}

