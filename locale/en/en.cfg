[mod-name]
rantz-research=Rantz Research

[mod-description]
rantz-research=Automatic research with selectable strategies, research pack filters, whitelists, blacklists, and level limits for infinite technologies. Open Rantz Research with Shift+T (customizable).

[rantz_research_gui]
pack_check_seconds=Pack check interval (seconds)
pack_check_seconds_tooltip=Seconds between lab inventory checks (1–3600). Default: 10. Press Enter to apply.
pack_grace_seconds=Empty pack grace period (seconds)
pack_grace_seconds_tooltip=How long a pack must remain absent after the first empty check before Dynamic disables it (0–3600). Default: 60. Changes are detected at the next check. Press Enter to apply.
pack_on=On
pack_off=Off
pack_dynamic=Dynamic
pack_available=Available for automatic research
pack_unavailable=Unavailable for automatic research
monitor_required=Monitor a lab to enable Dynamic mode.
dynamic_tooltip=On and Off are manual overrides. Dynamic follows the monitored lab's inventory using the timings in Settings. Packs without a saved choice follow their research unlocks. Availability permits research but does not prioritize it.
monitor_lab=Monitor this lab
expand_monitor=Show lab monitoring controls
collapse_monitor=Hide lab monitoring controls
stop_monitoring=Stop monitoring
monitor_lab_tooltip=Use this lab as the science supply sample for your force. Selecting another lab replaces the current monitor. Set the check interval and empty grace period in Settings.
monitor_location=Monitoring lab: __1__ (__2__, __3__)
column_max=Max
column_research=Research
column_required_packs=Required Packs
disabled_packs_tooltip=__1__: requires a disabled research pack. Enable its packs to allow automatic research.
target_level_tooltip=Target research level (inclusive). Enter a whole number, then press Enter or move the technology between lists to apply. Leave blank for no limit; 0 stops this technology. Applies to automatic research.
finite_target_tooltip=Target levels are only available for infinite research.
target_reached_tooltip=__1__: target level __2__ completed or exceeded. Increase the target to allow further research.
settings_label=Settings
expand_section=Expand __1__
collapse_section=Collapse __1__
expand_ingredients=Show science-pack checkboxes
collapse_ingredients=Hide science-pack checkboxes
allowed_label=Whitelist
blacklisted_label=Blacklist
disable_tooltip=Disable this technology and move it to the blacklist
enable_tooltip=Enable this technology and move it to the whitelist
title=Rantz Research
enabled=Enabled
enabled_tooltip=Automatically start new research
prioritized_only=Queued research only
prioritized_only_tooltip=Only research queued techs and their prerequisites. No queue, no automatic research
allow_switching=Allow research switching
allow_switching_tooltip=Let Rantz Research change the current research when you change research queue/settings
deprioritize_infinite_tech=Deprioritize infinite tech
deprioritize_infinite_tech_tooltip=Do not research infinite techs before all finite techs have been researched
allowed_ingredients_label=Research Packs
none=<none>
research_strategy=Research Strategy
research_fast=Fast
research_fast_tooltip=Prioritize the shortest total lab time: research units times time per unit. Pack types and quantities do not increase this time.
research_slow=Slow
research_slow_tooltip=Prioritize the longest total lab time: research units times time per unit. Pack types and quantities do not increase this time.
research_cheap=Cheap
research_cheap_tooltip=Prioritize the lowest weighted pack cost: research units times the sum of pack quantities and tier weights. Later packs cost more; weights estimate progression, not exact raw materials.
research_expensive=Expensive
research_expensive_tooltip=Prioritize the highest weighted pack cost: research units times the sum of pack quantities and tier weights. Later packs cost more; weights estimate progression, not exact raw materials.
research_balanced=Balanced
research_balanced_tooltip=Balance lab time and weighted pack cost: research units times time per unit times weighted packs per unit.
research_random=Random
research_random_tooltip=Prioritize techs in a random order

[controls]
rantz_research_toggle=Toggle Rantz Research GUI
