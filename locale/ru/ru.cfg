[mod-name]
rantz-research=Rantz Research

[mod-description]
rantz-research=Автоматическое исследование с выбором стратегии, фильтрами научных пакетов, белым и чёрным списками и ограничениями уровней бесконечных технологий. Открыть Rantz Research: Shift+T (сочетание клавиш можно изменить).

[rantz_research_gui]
pack_check_seconds=Интервал проверки пакетов (секунды)
pack_check_seconds_tooltip=Интервал проверки запасов лаборатории (1–3600 секунд). По умолчанию: 10. Нажмите Enter для сохранения.
pack_grace_seconds=Задержка при отсутствии пакета (секунды)
pack_grace_seconds_tooltip=Время непрерывного отсутствия пакета после первой пустой проверки до его отключения в автоматическом режиме (0–3600 секунд). По умолчанию: 60. Изменения обнаруживаются при следующей проверке. Нажмите Enter для сохранения.
pack_on=Вкл.
pack_off=Выкл.
pack_dynamic=Авто
pack_in_stock=В наличии\nПри последней проверке в наблюдаемой лаборатории были эти научные пакеты.
pack_out_of_stock=Нет в наличии\nПри последней проверке в наблюдаемой лаборатории не было этих научных пакетов. В режиме Авто исследование может продолжаться до окончания задержки отключения.
pack_not_researched=Не исследовано\nИсследование, открывающее этот научный пакет, ещё не завершено.
pack_stock_not_monitored=Запасы не отслеживаются\nВыберите лабораторию для наблюдения за её запасами. Вкл. и Выкл. по-прежнему управляют автоисследованием вручную.
monitor_required=Выберите лабораторию для наблюдения, чтобы включить автоматический режим пакетов.
dynamic_tooltip=Вкл. и Выкл. задаются вручную. Авто учитывает запасы наблюдаемой лаборатории и интервалы из настроек. Без сохранённого выбора пакеты включаются после открытия соответствующим исследованием. Доступность разрешает исследование, но не повышает его приоритет.
monitor_lab=Наблюдать за этой лабораторией
expand_monitor=Показать управление наблюдением за лабораторией
collapse_monitor=Скрыть управление наблюдением за лабораторией
stop_monitoring=Прекратить наблюдение
monitor_lab_tooltip=Использовать эту лабораторию для проверки запасов научных пакетов вашей команды. Выбор другой лаборатории заменяет текущую. Интервал проверки и задержка отключения задаются в настройках.
monitor_location=Наблюдаемая лаборатория: __1__ (__2__, __3__)
column_max=Макс.
column_research=Исследование
column_required_packs=Необходимые научные пакеты
disabled_packs_tooltip=__1__: требуется отключённый научный пакет. Включите необходимые пакеты для автоисследования.
target_level_tooltip=Целевой уровень исследования (включительно). Введите целое число, затем нажмите Enter или переместите технологию между списками, чтобы сохранить значение. Пустое поле — без ограничения; 0 останавливает эту технологию. Для автоисследования.
finite_target_tooltip=Целевой уровень доступен только для бесконечных исследований.
target_reached_tooltip=__1__: целевой уровень __2__ достигнут или превышен. Увеличьте цель для дальнейшего исследования.
settings_label=Настройки
expand_section=Развернуть: __1__
collapse_section=Свернуть: __1__
expand_ingredients=Показать выбор научных пакетов
collapse_ingredients=Скрыть выбор научных пакетов
allowed_label=Белый список
blacklisted_label=Чёрный список
disable_tooltip=Запретить технологию и переместить её в чёрный список
enable_tooltip=Разрешить технологию и переместить её в белый список
title=Rantz Research
enabled=Включено
enabled_tooltip=Автоматически начинать новое исследование
prioritized_only=Только исследования в очереди
prioritized_only_tooltip=Исследовать только техлоногии, добавленные в очередь, а так же их зависимости. Нет очереди - не исследований.
allow_switching=Разрешить смену исследования
allow_switching_tooltip=Позволить Rantz Research менять нынешнюю разработку, когда Вы меняеете очередь\настройки.
deprioritize_infinite_tech=Деприоритезировать бесконечные технологии
deprioritize_infinite_tech_tooltip=Не исследовать бесконечные технологии, пока не будут исследованы все конечные технологии.
allowed_ingredients_label=Научные пакеты
none=<пусто>
research_strategy=Стратегия исследования
research_fast=Быстро
research_fast_tooltip=Сначала исследования с наименьшим общим временем: число циклов умножается на время цикла. Виды и количество пакетов не увеличивают это время.
research_slow=Медлено
research_slow_tooltip=Сначала исследования с наибольшим общим временем: число циклов умножается на время цикла. Виды и количество пакетов не увеличивают это время.
research_cheap=Дешево
research_cheap_tooltip=Сначала исследования с наименьшей взвешенной стоимостью пакетов. Учитываются число циклов, количество пакетов и их уровень. Поздние пакеты дороже; это оценка, а не точная стоимость сырья.
research_expensive=Дорого
research_expensive_tooltip=Сначала исследования с наибольшей взвешенной стоимостью пакетов. Учитываются число циклов, количество пакетов и их уровень. Поздние пакеты дороже; это оценка, а не точная стоимость сырья.
research_balanced=Сбалансировано
research_balanced_tooltip=Баланс времени и стоимости: число циклов умножается на время цикла и взвешенную стоимость пакетов за цикл.
research_random=Случайно
research_random_tooltip=В случайном порядке

[controls]
rantz_research_toggle=Меню Rantz Research
